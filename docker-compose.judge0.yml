version: '3.8'
services:
  judge0:
    image: judge0/judge0:latest
    container_name: judge0
    restart: unless-stopped
    ports:
      - '2358:2358' # Judge0 default port in many CE images
    environment:
      - DATABASE_URL=postgresql://judge0:judge0@db:5432/judge0
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: judge0_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: judge0_redis
    restart: unless-stopped
    volumes:
      - judge0_redis_data:/data

volumes:
  judge0_db_data:
  judge0_redis_data:
