<svg width="500" height="120" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Road base -->
  <rect width="500" height="120" fill="#1a1a1a"/>
  
  <!-- Road surface -->
  <rect y="20" width="500" height="80" fill="#2d2d2d"/>
  
  <!-- Yellow center line dashes -->
  <line x1="0" y1="60" x2="40" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="40" y1="60" x2="80" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="80" y1="60" x2="120" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="120" y1="60" x2="160" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="160" y1="60" x2="200" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="200" y1="60" x2="240" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="240" y1="60" x2="280" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="280" y1="60" x2="320" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="320" y1="60" x2="360" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="360" y1="60" x2="400" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="400" y1="60" x2="440" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  <line x1="440" y1="60" x2="500" y2="60" stroke="#fbbf24" stroke-width="3" stroke-dasharray="30,30"/>
  
  <!-- Road markings on sides -->
  <rect y="20" width="500" height="2" fill="#666"/>
  <rect y="98" width="500" height="2" fill="#666"/>
</svg>